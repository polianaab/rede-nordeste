# =============================================
# BANCO DE DADOS - SUPABASE
# =============================================
spring.datasource.url=jdbc:postgresql://db.mffagtkxmzwejhunqifo.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# =============================================
# JPA / HIBERNATE
# =============================================
# "none" = Hibernate não mexe no banco, o schema.sql já está criado no Supabase
spring.jpa.hibernate.ddl-auto=none

# Não precisa rodar schema.sql pois o banco já foi criado manualmente no Supabase
spring.sql.init.mode=never

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Necessário para o Hibernate encontrar as tabelas corretamente no Supabase
spring.jpa.properties.hibernate.default_schema=public

# =============================================
# JWT
# =============================================
jwt.secret=${JWT_SECRET:semeia_nordeste_chave_local_dev_32chars!!}

# =============================================
# SEGURANÇA / LOGS
# =============================================
logging.level.org.springframework.security=WARN
logging.level.com.semeia_nordeste=INFO